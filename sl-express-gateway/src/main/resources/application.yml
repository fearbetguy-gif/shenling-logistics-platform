server:
  port: 8080

spring:
  application:
    name: sl-express-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: sl-express-user
          uri: ${USER_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: sl-express-order
          uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: sl-express-transport
          uri: ${TRANSPORT_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/transport/**
          filters:
            - StripPrefix=2
