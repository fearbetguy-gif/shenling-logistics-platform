server:
  port: 8083

spring:
  application:
    name: sl-express-transport
  datasource:
    url: ${TRANSPORT_DB_URL:jdbc:mysql://127.0.0.1:3307/shenling_logistics?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${TRANSPORT_DB_USERNAME:root}
    password: ${TRANSPORT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
