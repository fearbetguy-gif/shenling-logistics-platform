server:
  port: 8082

spring:
  application:
    name: sl-express-order
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://127.0.0.1:3307/wuliu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

assistant:
  ai:
    enabled: ${ASSISTANT_AI_ENABLED:false}
    provider: ${ASSISTANT_AI_PROVIDER:openai-compatible}
    base-url: ${ASSISTANT_AI_BASE_URL:https://api.openai.com/v1}
    model: ${ASSISTANT_AI_MODEL:填写你的模型名称}
    api-key: ${ASSISTANT_AI_API_KEY:}
